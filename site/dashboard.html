<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clod dashboard</title><link rel="stylesheet" href="dashboard.css"></head><body>
<main><h1 id="instance">Clod dashboard</h1><div id="dashboard"><p id="status" role="status"></p>
<section><h2>Persona</h2><form id="persona"><textarea name="content" rows="8" cols="70" required></textarea><br><button>Save persona</button><button type="button" id="resetPersona">Reset</button></form></section>
<section><h2>Configuration</h2><div id="config"></div></section>
<section><h2>Moderation</h2><form id="moderation"><label><input name="enabled" type="checkbox"> Automatic moderation enabled</label><br><label>Timeout (seconds) <input name="timeout_seconds" type="number" min="1" step="1" required></label><br><label>Policy<br><textarea name="policy" rows="12" cols="70" required></textarea></label><br><button>Save moderation</button></form><h3>Active timeouts</h3><button id="refreshTimeouts">Refresh</button><div id="timeouts"></div></section>
<section><h2>Memories</h2><form id="addMemory"><label>Username <select name="userId" required></select></label> <label>Memory <input name="fact" required></label> <button>Add</button></form><div id="memories"></div><button id="clearAll">Clear all memories</button></section>
<section><h2>Blacklist</h2><pre id="blacklist"></pre><form id="blacklistForm"><label>Username <select name="userId" required></select></label> <button name="action" value="add">Add</button> <button name="action" value="remove">Remove (also clears timeout)</button></form></section>
<section><h2>Usage</h2><form id="usage"><label>Group by <select name="group_by"><option>total</option><option>day</option><option>source</option><option>model</option><option>requested_model</option><option>provider</option><option>initiator</option></select></label> <label>Last minutes <input name="last_minutes" type="number" min="1"></label> <button>Inspect</button></form><pre id="usageResult"></pre></section>
<p>Discord actions, source tools, image generation, coding agent, monkeypatch, and Discord REPL require their normal Discord context and permissions.</p></div></main><script src="dashboard.js"></script></body></html>
